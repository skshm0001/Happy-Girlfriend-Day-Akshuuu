<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Akshuuu ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff4b8b,#7b2ff7);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}

#lockScreen{
text-align:center;
}

.lock{
font-size:90px;
animation:float 2s ease-in-out infinite;
}

h1{
margin:20px 0;
font-size:35px;
}

p{
opacity:.9;
margin-bottom:25px;
}

input{
padding:15px;
width:260px;
border:none;
border-radius:30px;
text-align:center;
font-size:18px;
outline:none;
}

button{
margin-top:20px;
padding:14px 35px;
border:none;
border-radius:30px;
background:white;
color:#ff4b8b;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

#error{
margin-top:15px;
color:#ffe4e4;
}

@keyframes float{
0%,100%{
transform:translateY(0px);
}
50%{
transform:translateY(-12px);
}
}
</style>

</head>
<body>

<div id="lockScreen">

<div class="lock">🔒❤️</div>

<h1>Private Surprise</h1>

<p>Only Akshuuu can unlock this ❤️</p>

<input
type="password"
id="password"
placeholder="Enter Secret Password">

<br>

<button onclick="unlock()">
Unlock ❤️
</button>

<p id="error"></p>

</div>

<script>

const correctPassword="Akshuuu123";

function unlock(){

const entered=document.getElementById("password").value;

if(entered===correctPassword){

window.location.href="home.html";

}else{

document.getElementById("error").innerHTML="Wrong Password ❤️";

}

}

</script>

</body>
</html>
