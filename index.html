<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>For Someone Special ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<canvas id="stars"></canvas>

<div class="overlay"></div>

<!-- PASSWORD SCREEN -->

<div class="password-screen">

<div class="glass">

<h1>❤️</h1>

<h2>A Little Surprise Awaits...</h2>

<p>
Enter the secret code to continue.
</p>

<input
type="password"
id="password"
placeholder="Secret Code">

<button id="unlockBtn">
Unlock ❤️
</button>

<p id="error"></p>

</div>

</div>

<!-- WEBSITE (Hidden Initially) -->

<div class="website">

<section class="hero">

<h1>Happy Girlfriend's Day ❤️</h1>

<h2>Welcome to your surprise...</h2>

<p>
This is only the beginning of something made especially for you.
</p>

</section>

</div>

<script src="script.js"></script>

</body>

</html>
